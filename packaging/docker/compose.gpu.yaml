# Add to compose.yaml to run on an NVIDIA card:
#   docker compose -f packaging/docker/compose.yaml -f packaging/docker/compose.gpu.yaml up -d --build
# Requires NVIDIA driver >= 570 and the NVIDIA Container Toolkit on the host.
services:
  app:
    build:
      args:
        GPU: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]