# Run checks on every pull request and every push to main: Python tests, frontend lint +
# typecheck + test + build. Models are not downloaded (tests are mocked), so runs stay fast.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "assets/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # The new test suite is currently verified on Windows. Add ubuntu here after the full
    # suite has been run successfully on Linux.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group dev --group desktop

      - name: Test
        run: uv run --frozen pytest -q

  frontend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app-desktop/hupesi-tts-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app-desktop/hupesi-tts-app/package-lock.json

      - run: npm ci
      # Biome (ultracite): errors block the run; warnings are shown to be fixed gradually.
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
